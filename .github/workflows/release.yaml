# Cuts a signed, versioned release: cross-platform zips + SHA256SUMS + GPG
# signature attached to a GitHub Release. This is what the public Terraform
# Registry requires.
#
# Trigger: push a tag matching the version in .speakeasy/gen.yaml, e.g.
#   git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: "write"

jobs:
  release:
    name: "GoReleaser"
    runs-on: "ubuntu-latest"
    # GPG_PRIVATE_KEY lives in this environment, not as a repo secret, so only
    # this job can read it, and only for a push matching the environment's
    # deployment tag policy (v*) -- see the "release" environment settings.
    environment: release
    steps:
      - name: "Check out"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Set up Go"
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      # Plain `gpg --import` -- no third-party action gets to see the key.
      - name: "Import GPG key"
        env:
          GPG_PRIVATE_KEY: "${{ secrets.GPG_PRIVATE_KEY }}"
        run: |
          set -euo pipefail
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          fingerprint="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')"
          echo "fingerprint=${fingerprint}" >> "$GITHUB_OUTPUT"
        id: import_gpg

      - name: "Run GoReleaser"
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: "release --clean"
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          GPG_FINGERPRINT: "${{ steps.import_gpg.outputs.fingerprint }}"
