# Cuts a signed, versioned release: cross-platform zips + SHA256SUMS + GPG
# signature attached to a GitHub Release. This is what the public Terraform
# Registry requires.
#
# Trigger: push a tag matching the version in .speakeasy/gen.yaml, e.g.
#   git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: "write"

jobs:
  release:
    name: "GoReleaser"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Check out"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Set up Go"
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: "Import GPG key"
        uses: crazy-max/ghaction-import-gpg@v6
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: "Run GoReleaser"
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: "release --clean"
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          GPG_FINGERPRINT: "${{ steps.import_gpg.outputs.fingerprint }}"
